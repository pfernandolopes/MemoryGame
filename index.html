<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bluey – Jogo da Memória</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #4FC3F7;
    --blue-dark: #0288D1;
    --orange: #FF8C42;
    --yellow: #FFD54F;
    --green: #81C784;
    --bg: #0d1b2e;
    --card-back: #1a3a5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 40px;
    overflow-x: hidden;
  }

  /*Stars*/
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; border-radius: 50%; background: white; animation: twinkle var(--d) ease-in-out infinite alternate; }
  @keyframes twinkle { from{opacity:.1} to{opacity:.9} }

  /* ── TOP BAR ── */
  .topbar {
    position: relative; z-index: 2;
    width: 100%; max-width: 480px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px 0;
  }
  .logo { font-size: 2rem; font-weight: 900; line-height: 1; }
  .logo span:first-child { color: var(--blue); text-shadow: 0 0 16px #4FC3F799; }
  .logo span:last-child  { color: var(--orange); text-shadow: 0 0 16px #FF8C4299; }
  .timer-block { text-align: right; }
  .timer { font-size: 2rem; font-weight: 900; color: white; line-height: 1; }
  .difficulty { font-size: 0.7rem; font-weight: 800; color: var(--yellow); letter-spacing: 2px; text-transform: uppercase; }

  /* ── TABS ── */
  .tabs {
    position: relative; z-index: 2;
    width: 100%; max-width: 480px;
    display: flex; border-bottom: 2px solid #1a3a5c;
    margin-top: 10px;
  }
  .tab {
    flex: 1; text-align: center; padding: 10px 0;
    font-size: 0.78rem; font-weight: 800; letter-spacing: 2px;
    color: #4a6a8a; cursor: pointer; text-transform: uppercase;
    transition: color .2s;
  }
  .tab.active { color: var(--yellow); border-bottom: 3px solid var(--yellow); margin-bottom: -2px; }

  /* ── PANELS ── */
  .panel { display: none; width: 100%; max-width: 480px; }
  .panel.active { display: flex; flex-direction: column; align-items: center; }

  /* ── DIFFICULTY PILLS ── */
  .diff-row {
    position: relative; z-index: 2;
    display: flex; gap: 10px; margin: 14px 0 6px;
    width: 100%; max-width: 440px; justify-content: center;
  }
  .diff-btn {
    flex: 1; background: #1a2a40; border: 2px solid #2a4a6a;
    border-radius: 50px; color: #7a9ab8;
    font-family: 'Nunito', sans-serif; font-size: 0.82rem; font-weight: 800;
    padding: 8px 0; cursor: pointer; letter-spacing: 1px; text-transform: uppercase;
    transition: all .2s;
  }
  .diff-btn.active { background: var(--yellow); border-color: var(--yellow); color: #0d1b2e; }

  /* ── HUD ── */
  .hud-row {
    position: relative; z-index: 2;
    display: flex; gap: 16px; margin-bottom: 12px;
    font-size: 0.78rem; font-weight: 800; color: #7a9ab8;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .hud-row span { color: white; }

  /* ── GRID ── */
  .grid {
    position: relative; z-index: 2;
    display: grid; gap: 8px;
    width: calc(100% - 32px); max-width: 444px;
  }
  .grid.easy   { grid-template-columns: repeat(4,1fr); }
  .grid.medium { grid-template-columns: repeat(4,1fr); }
  .grid.hard   { grid-template-columns: repeat(4,1fr); }

  /* ── CARDS ── */
  .card { aspect-ratio: 1; perspective: 600px; cursor: pointer; }
  .card-inner {
    width:100%; height:100%;
    position:relative; transform-style:preserve-3d;
    transition: transform .4s cubic-bezier(.4,0,.2,1);
    border-radius: 14px;
  }
  .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
  .card-face {
    position:absolute; inset:0; border-radius:14px;
    backface-visibility:hidden; display:flex;
    align-items:center; justify-content:center; overflow:hidden;
  }
  .card-back {
    background: var(--card-back); border: 2.5px solid var(--blue);
    box-shadow: 0 0 10px #4FC3F730; font-size: 1.6rem;
  }
  .card-back::after { content:"🐾"; opacity:.3; }
  .card-front {
    transform: rotateY(180deg); background:#fff;
    border: 2.5px solid var(--orange); box-shadow: 0 0 14px #FF8C4240;
  }
  .card-front img { width:100%; height:100%; object-fit:cover; border-radius:11px; }
  .card-label {
    position:absolute; bottom:0; left:0; right:0;
    background:#0009; color:white; font-size:0.6rem; font-weight:800;
    text-align:center; padding:2px 0; border-radius:0 0 11px 11px;
  }
  .card.matched .card-front { border-color:var(--green); box-shadow:0 0 20px #81C78470; animation:matchPulse .5s ease; }
  @keyframes matchPulse {
    0%,100%{transform:rotateY(180deg) scale(1)}
    50%{transform:rotateY(180deg) scale(1.1)}
  }
  .card.wrong .card-inner { animation:shake .5s ease; }
  @keyframes shake {
    0%,100%{transform:rotateY(180deg) translateX(0)}
    20%{transform:rotateY(180deg) translateX(-6px)}
    40%{transform:rotateY(180deg) translateX(6px)}
    60%{transform:rotateY(180deg) translateX(-4px)}
    80%{transform:rotateY(180deg) translateX(4px)}
  }

  /* ── BOTTOM BUTTONS ── */
  .bottom-row {
    position: relative; z-index:2;
    display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; justify-content:center;
  }
  .btn {
    background:#1a3a5c; border:2px solid var(--blue); border-radius:16px;
    color:#b0d4f1; font-family:'Nunito',sans-serif; font-size:0.8rem; font-weight:800;
    padding:10px 0; width:68px; cursor:pointer; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    transition:background .2s;
  }
  .btn:hover { background:#254a70; }
  .btn .icon { font-size:1.4rem; }
  .btn.novo { background:var(--yellow); border-color:var(--yellow); color:#0d1b2e; }
  .btn.novo:hover { background:#ffe066; }

  /* ── HISTÓRICO ── */
  .history-list {
    width: calc(100% - 32px); max-width: 444px;
    display: flex; flex-direction: column; gap: 10px;
    margin-top: 16px;
  }
  .history-empty { color:#4a6a8a; font-size:0.9rem; font-weight:700; text-align:center; margin-top:40px; }
  .hist-card {
    background:#1a3a5c; border:2px solid #2a4a6a; border-radius:16px;
    padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
  }
  .hist-left .hist-mode { color:var(--yellow); font-size:0.85rem; font-weight:800; }
  .hist-left .hist-date { color:#4a6a8a; font-size:0.72rem; font-weight:700; margin-top:2px; }
  .hist-right { text-align:right; }
  .hist-right .hist-moves { color:white; font-size:1.1rem; font-weight:900; }
  .hist-right .hist-errors { color:#FF8C42; font-size:0.75rem; font-weight:700; }
  .hist-best { background: linear-gradient(135deg,#1a3a5c,#0d2a4a); border-color:var(--yellow); }
  .hist-best .hist-mode::after { content:" 🏆"; }

  /* ── WIN OVERLAY ── */
  .overlay {
    display:none; position:fixed; inset:0; z-index:100;
    background:#0d1b2eee; flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px; text-align:center; animation:fadeIn .4s ease;
  }
  .overlay.show { display:flex; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .overlay h2 { font-size:2.2rem; font-weight:900; color:var(--yellow); animation:bounce .6s ease infinite alternate; }
  @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-10px)} }
  .overlay p { color:#b0d4f1; font-size:1rem; font-weight:700; }
  .confetti { font-size:2.2rem; letter-spacing:4px; }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo"><span>Blue</span><span>y!</span></div>
  <div class="timer-block">
    <div class="timer" id="timer">00:00</div>
    <div class="difficulty" id="diff-label">FÁCIL</div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('game')">JOGO</div>
  <div class="tab" onclick="switchTab('history')">HISTÓRICO</div>
</div>

<!-- GAME PANEL -->
<div class="panel active" id="panel-game">
  <div class="diff-row">
    <button class="diff-btn active" onclick="setDiff('easy',this)">FÁCIL</button>
    <button class="diff-btn" onclick="setDiff('medium',this)">MÉDIO</button>
    <button class="diff-btn" onclick="setDiff('hard',this)">DIFÍCIL</button>
  </div>
  <div class="hud-row">
    ERROS <span id="erros">0</span> &nbsp; PARES <span id="pairs">0</span>
  </div>
  <div class="grid easy" id="grid"></div>
  <div class="bottom-row">
    <button class="btn" onclick="undoLast()"><span class="icon">↩️</span>VOLTAR</button>
    <button class="btn novo" onclick="initGame()"><span class="icon">🔄</span>NOVO</button>
    <button class="btn" onclick="showHint()"><span class="icon">💡</span>DICA</button>
  </div>
</div>

<!-- HISTORY PANEL -->
<div class="panel" id="panel-history">
  <div class="history-list" id="history-list">
    <div class="history-empty">Nenhum jogo finalizado ainda.<br>Complete uma partida para ver aqui! 🐾</div>
  </div>
</div>

<!-- WIN OVERLAY -->
<div class="overlay" id="overlay">
  <div class="confetti">🎉🐾🎊</div>
  <h2>Parabéns!</h2>
  <p id="overlay-msg"></p>
  <button style="margin-top:8px;background:var(--orange);color:white;border:none;border-radius:50px;padding:12px 32px;font-family:Nunito,sans-serif;font-size:1rem;font-weight:900;cursor:pointer"
    onclick="initGame();document.getElementById('overlay').classList.remove('show')">Jogar de Novo!</button>
</div>

let currentDiff = 'easy';
let flipped=[], matched=0, moves=0, errors=0, locked=false, total=0;
let timerInterval=null, seconds=0;
let lastFlipped=null;
let hintTimeout=null;
let history=JSON.parse(localStorage.getItem('bluey_history')||'[]');

const DIFF_CONFIG = {
  easy:   { pairs:8,  label:'FÁCIL',  cols:4 },
  medium: { pairs:12, label:'MÉDIO',  cols:4 },
  hard:   { pairs:16, label:'DIFÍCIL',cols:4 },
};

function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='game')||(i===1&&tab==='history')));
  document.getElementById('panel-game').classList.toggle('active', tab==='game');
  document.getElementById('panel-history').classList.toggle('active', tab==='history');
  if(tab==='history') renderHistory();
}

function setDiff(d, btn){
  currentDiff=d;
  document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('diff-label').textContent = DIFF_CONFIG[d].label;
  initGame();
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

function startTimer(){
  clearInterval(timerInterval); seconds=0; updateTimer();
  timerInterval=setInterval(()=>{seconds++;updateTimer();},1000);
}
function stopTimer(){ clearInterval(timerInterval); }
function updateTimer(){
  const m=String(Math.floor(seconds/60)).padStart(2,'0');
  const s=String(seconds%60).padStart(2,'0');
  document.getElementById('timer').textContent=m+':'+s;
}

function initGame(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  flipped=[]; matched=0; moves=0; errors=0; locked=false; lastFlipped=null;
  const cfg=DIFF_CONFIG[currentDiff];
  total=cfg.pairs;
  grid.className='grid '+currentDiff;
  updateHUD();
  startTimer();

  let pool=shuffle([...IMAGES]).slice(0,cfg.pairs);
  const cards=shuffle([...pool,...pool]).map((img,i)=>({id:i,name:img.name,src:img.src,el:null}));

  cards.forEach(card=>{
    const el=document.createElement('div');
    el.className='card';
    el.innerHTML=`<div class="card-inner">
      <div class="card-face card-back"></div>
      <div class="card-face card-front">
        <img src="${card.src}" alt="${card.name}" loading="lazy">
        <div class="card-label">${card.name}</div>
      </div></div>`;
    el.addEventListener('click',()=>onCardClick(card));
    card.el=el; grid.appendChild(el);
  });
}

function onCardClick(card){
  if(locked||card.el.classList.contains('flipped')||card.el.classList.contains('matched')) return;
  if(flipped.length>=2) return;
  card.el.classList.add('flipped');
  flipped.push(card);
  lastFlipped=card;
  if(flipped.length===2){moves++;updateHUD();checkMatch();}
}

function checkMatch(){
  const [a,b]=flipped;
  if(a.name===b.name){
    setTimeout(()=>{
      a.el.classList.add('matched'); b.el.classList.add('matched');
      flipped=[]; matched++; updateHUD();
      if(matched===total){ stopTimer(); setTimeout(showWin,400); }
    },350);
  } else {
    errors++; locked=true;
    a.el.classList.add('wrong'); b.el.classList.add('wrong');
    setTimeout(()=>{
      a.el.classList.remove('flipped','wrong');
      b.el.classList.remove('flipped','wrong');
      flipped=[]; locked=false; updateHUD();
    },900);
  }
}

function updateHUD(){
  document.getElementById('erros').textContent=errors;
  document.getElementById('pairs').textContent=matched+' / '+total;
}

function undoLast(){
  if(!lastFlipped||flipped.length===0) return;
  const card=flipped.find(c=>c.id===lastFlipped.id);
  if(card){ card.el.classList.remove('flipped'); flipped=flipped.filter(c=>c.id!==lastFlipped.id); lastFlipped=null; }
}

function showHint(){
  if(locked) return;
  // find first unmatched pair and briefly show them
  const grid=document.getElementById('grid');
  const cards=[...grid.querySelectorAll('.card:not(.matched):not(.flipped)')];
  if(cards.length<2) return;
  cards[0].classList.add('flipped');
  setTimeout(()=>cards[0].classList.remove('flipped'),800);
}

function showWin(){
  const cfg=DIFF_CONFIG[currentDiff];
  const entry={ mode:cfg.label, moves, errors, time:seconds, date:new Date().toLocaleDateString('pt-BR') };
  history.unshift(entry);
  if(history.length>20) history=history.slice(0,20);
  localStorage.setItem('bluey_history',JSON.stringify(history));

  const t=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
  document.getElementById('overlay-msg').textContent=
    `${cfg.label} · ${moves} jogadas · ${errors} erro${errors!==1?'s':''} · ${t} ⏱`;
  document.getElementById('overlay').classList.add('show');
}

function renderHistory(){
  const el=document.getElementById('history-list');
  if(!history.length){ el.innerHTML='<div class="history-empty">Nenhum jogo finalizado ainda.<br>Complete uma partida para ver aqui! 🐾</div>'; return; }
  const best=history.reduce((b,h)=>h.moves<b.moves?h:b, history[0]);
  el.innerHTML=history.map((h,i)=>{
    const isBest=h===best;
    const t=String(Math.floor(h.time/60)).padStart(2,'0')+':'+String(h.time%60).padStart(2,'0');
    return `<div class="hist-card${isBest?' hist-best':''}">`+
      `<div class="hist-left"><div class="hist-mode">${h.mode}</div><div class="hist-date">${h.date}</div></div>`+
      `<div class="hist-right"><div class="hist-moves">${h.moves} jogadas</div><div class="hist-errors">${h.errors} erros · ${t}</div></div>`+
      `</div>`;
  }).join('');
}

initGame();
</script>
</body>
</html>
