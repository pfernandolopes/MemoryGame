<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#18171f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Memory Game</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #4FC3F7;
    --orange: #FF8C42;
    --yellow: #FFD54F;
    --green: #81C784;
    --bg: #0d1b2e;
    --card-back: #1a3a5c;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: 'Nunito', sans-serif;
    background-color: var(--bg);
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .header {
    font-size: 2em;
    margin-bottom: 20px;
  }
  .game-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .card {
    width: 100px;
    height: 100px;
    background-color: var(--card-back);
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 1.5em;
    cursor: pointer;
  }
  .card.flipped {
    background-color: var(--blue);
  }
</style>
</head>
<body>
  <header class="header">Memory Game</header>
  <main class="game-container" id="gameBoard">
    <!-- Game cards will be injected here -->
  </main>
  <script>
    const gameBoard = document.getElementById("gameBoard");
    const cards = Array.from({ length: 16 }, (_, i) => i % 8).sort(() => Math.random() - 0.5);

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;

    function flipCard(card) {
      if (lockBoard || card === firstCard) return;
      card.classList.add("flipped");

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      lockBoard = true;

      const isMatch = firstCard.dataset.value === secondCard.dataset.value;
      setTimeout(() => {
        if (!isMatch) {
          firstCard.classList.remove("flipped");
          secondCard.classList.remove("flipped");
        }
        firstCard = null;
        secondCard = null;
        lockBoard = false;
      }, 1000);
    }

    cards.forEach((value) => {
      const card = document.createElement("div");
      card.classList.add("card");
      card.dataset.value = value;
      card.textContent = "?";
      card.addEventListener("click", () => flipCard(card));
      gameBoard.appendChild(card);
    });
  </script>
</body>
</html>
