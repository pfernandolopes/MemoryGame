<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Bluey – Jogo da Memória</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#4FC3F7">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bluey">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#4FC3F7;
  --blue-dark:#0288D1;
  --orange:#FF8C42;
  --yellow:#FFD54F;
  --green:#81C784;
  --bg:#0d1b2e;
  --card-back:#1a3a5c;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Nunito',sans-serif;
  background:var(--bg);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 0 40px;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

.stars{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

.star{
  position:absolute;
  border-radius:50%;
  background:white;
  animation:twinkle var(--d) ease-in-out infinite alternate;
}

@keyframes twinkle{
  from{opacity:.1}
  to{opacity:.9}
}

.topbar{
  position:relative;
  z-index:2;
  width:100%;
  max-width:480px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 20px 0;
}

.logo{
  font-size:2rem;
  font-weight:900;
}

.logo span:first-child{
  color:var(--blue);
}

.logo span:last-child{
  color:var(--orange);
}

.timer{
  color:white;
  font-size:2rem;
  font-weight:900;
}

.difficulty{
  color:var(--yellow);
  font-size:.7rem;
  font-weight:800;
  letter-spacing:2px;
  text-align:right;
}

.diff-row{
  display:flex;
  gap:10px;
  margin:14px 0;
  width:100%;
  max-width:440px;
  justify-content:center;
  z-index:2;
}

.diff-btn{
  flex:1;
  background:#1a2a40;
  border:2px solid #2a4a6a;
  border-radius:50px;
  color:#7a9ab8;
  font-family:'Nunito',sans-serif;
  font-size:.82rem;
  font-weight:800;
  padding:8px 0;
  cursor:pointer;
}

.diff-btn.active{
  background:var(--yellow);
  border-color:var(--yellow);
  color:#0d1b2e;
}

.hud-row{
  display:flex;
  gap:16px;
  margin-bottom:12px;
  font-size:.78rem;
  font-weight:800;
  color:#7a9ab8;
  letter-spacing:1px;
  text-transform:uppercase;
}

.hud-row span{
  color:white;
}

.grid{
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  width:calc(100% - 32px);
  max-width:444px;
}

.card{
  aspect-ratio:1;
  perspective:600px;
  cursor:pointer;
}

.card-inner{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .4s cubic-bezier(.4,0,.2,1);
  border-radius:14px;
}

.card.flipped .card-inner,
.card.matched .card-inner{
  transform:rotateY(180deg);
}

.card-face{
  position:absolute;
  inset:0;
  border-radius:14px;
  backface-visibility:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.card-back{
  background:var(--card-back);
  border:2.5px solid var(--blue);
  box-shadow:0 0 10px #4FC3F730;
  font-size:1.6rem;
}

.card-back::after{
  content:"🐾";
  opacity:.3;
}

.card-front{
  transform:rotateY(180deg);
  background:#fff;
  border:2.5px solid var(--orange);
}

.card-front img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card.matched .card-front{
  border-color:var(--green);
  box-shadow:0 0 20px #81C78470;
}

.bottom-row{
  display:flex;
  gap:12px;
  margin-top:16px;
  flex-wrap:wrap;
  justify-content:center;
}

.btn{
  background:#1a3a5c;
  border:2px solid var(--blue);
  border-radius:16px;
  color:#b0d4f1;
  font-family:'Nunito',sans-serif;
  font-size:.8rem;
  font-weight:800;
  padding:10px 0;
  width:68px;
  cursor:pointer;
  text-align:center;
}

.btn.novo{
  background:var(--yellow);
  border-color:var(--yellow);
  color:#0d1b2e;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#0d1b2eee;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  text-align:center;
}

.overlay.show{
  display:flex;
}

.overlay h2{
  font-size:2.2rem;
  font-weight:900;
  color:var(--yellow);
}

.overlay p{
  color:#b0d4f1;
  font-size:1rem;
  font-weight:700;
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="topbar">
  <div class="logo">
    <span>Blue</span><span>y!</span>
  </div>

  <div>
    <div class="timer" id="timer">00:00</div>
    <div class="difficulty" id="diff-label">FÁCIL</div>
  </div>
</div>

<div class="diff-row">
  <button class="diff-btn active">FÁCIL</button>
  <button class="diff-btn">MÉDIO</button>
  <button class="diff-btn">DIFÍCIL</button>
</div>

<div class="hud-row">
  ERROS <span id="erros">0</span>
  PARES <span id="pairs">0</span>
</div>

<div class="grid" id="grid"></div>

<div class="bottom-row">
  <button class="btn">↩️</button>
  <button class="btn novo" onclick="initGame()">🔄</button>
  <button class="btn">💡</button>
</div>

<div class="overlay" id="overlay">
  <h2>Parabéns!</h2>
  <p id="overlay-msg"></p>

  <button
    style="
      margin-top:8px;
      background:var(--orange);
      color:white;
      border:none;
      border-radius:50px;
      padding:12px 32px;
      font-family:Nunito,sans-serif;
      font-size:1rem;
      font-weight:900;
      cursor:pointer
    "
    onclick="initGame();document.getElementById('overlay').classList.remove('show')"
  >
    Jogar de Novo!
  </button>
</div>

<script>
const images = [
  "🐶",
  "🦴",
  "🐾",
  "🎾",
  "⭐",
  "🌈",
  "🚀",
  "🎈"
];

let cards = [];
let flipped = [];
let matched = 0;
let errors = 0;
let timer = 0;
let interval;

const grid = document.getElementById("grid");

function shuffle(array){
  return array.sort(() => Math.random() - 0.5);
}

function initGame(){

  clearInterval(interval);

  timer = 0;
  matched = 0;
  errors = 0;

  document.getElementById("timer").textContent = "00:00";
  document.getElementById("erros").textContent = errors;
  document.getElementById("pairs").textContent = matched;

  flipped = [];

  cards = shuffle([...images, ...images]);

  grid.innerHTML = "";

  cards.forEach((emoji,index)=>{

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back"></div>

        <div class="card-face card-front">
          <div style="font-size:2.2rem">${emoji}</div>
        </div>
      </div>
    `;

    card.addEventListener("click",()=>flipCard(card,index));

    grid.appendChild(card);
  });

  interval = setInterval(()=>{
    timer++;

    const min = String(Math.floor(timer/60)).padStart(2,"0");
    const sec = String(timer%60).padStart(2,"0");

    document.getElementById("timer").textContent = `${min}:${sec}`;
  },1000);
}

function flipCard(card,index){

  if(
    card.classList.contains("flipped") ||
    card.classList.contains("matched") ||
    flipped.length >= 2
  ){
    return;
  }

  card.classList.add("flipped");

  flipped.push({card,index});

  if(flipped.length === 2){

    const first = flipped[0];
    const second = flipped[1];

    if(cards[first.index] === cards[second.index]){

      first.card.classList.add("matched");
      second.card.classList.add("matched");

      matched++;

      document.getElementById("pairs").textContent = matched;

      flipped = [];

      if(matched === images.length){

        clearInterval(interval);

        document.getElementById("overlay-msg").textContent =
          `Você venceu em ${document.getElementById("timer").textContent}`;

        document.getElementById("overlay").classList.add("show");
      }

    } else {

      errors++;

      document.getElementById("erros").textContent = errors;

      setTimeout(()=>{
        first.card.classList.remove("flipped");
        second.card.classList.remove("flipped");
        flipped = [];
      },800);
    }
  }
}

for(let i=0;i<70;i++){

  const star = document.createElement("div");

  star.className = "star";

  const size = Math.random()*3+1;

  star.style.width = `${size}px`;
  star.style.height = `${size}px`;

  star.style.left = `${Math.random()*100}%`;
  star.style.top = `${Math.random()*100}%`;

  star.style.setProperty("--d",`${Math.random()*3+1}s`);

  document.getElementById("stars").appendChild(star);
}

initGame();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(() => console.log("PWA ativo"))
      .catch(err => console.log("Erro SW", err));
  });
}
</script>

</body>
</html>
